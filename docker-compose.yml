services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netzertech_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_NAME: "Netzertech University Platform"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:IuH2eVHJTf6/BcM5J37ChN2783W49gIQyFvoVEhZ5x4=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: netzertech_university
      DB_USERNAME: postgres
      DB_PASSWORD: secret_password
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
    networks:
      - netzertech_network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: netzertech_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - netzertech_network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: netzertech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: netzertech_university
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - netzertech_network

  redis:
    image: redis:7-alpine
    container_name: netzertech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - netzertech_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netzertech_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_NAME: "Netzertech University Platform"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:IuH2eVHJTf6/BcM5J37ChN2783W49gIQyFvoVEhZ5x4=}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: netzertech_university
      DB_USERNAME: postgres
      DB_PASSWORD: secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    networks:
      - netzertech_network
    depends_on:
      - app
      - redis
      - postgres

  # Optional WebSocket server (Enable when laravel/reverb is installed via composer)
  # reverb:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: netzertech_reverb
  #   restart: unless-stopped
  #   command: php artisan reverb:start --host=0.0.0.0 --port=8080
  #   working_dir: /var/www/html
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./:/var/www/html
  #   networks:
  #     - netzertech_network
  #   depends_on:
  #     - app
  #     - redis

networks:
  netzertech_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
